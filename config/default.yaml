# ros_deep_learning DepthNet normally publishes 32FC1 values. Change this to
# 0.001 only when the configured depth topic contains millimetres.
depth_scale: 1.0
# Metric calibration after conversion of the depth image to metres:
# calibrated_depth = depth * depth_calibration_scale + depth_calibration_offset
depth_calibration_scale: 1.0
depth_calibration_offset: 0.0
depth_window_radius: 4
min_depth: 0.05
max_depth: 100.0
max_depth_age: 0.5
# Exponential moving average in output_frame. Smaller values suppress jitter more,
# while 1.0 disables smoothing. Reset after a detection gap to avoid stale positions.
position_smoothing_factor: 0.25
position_filter_reset_time: 1.0
output_frame: "map"
object_frame_prefix: "object_"
storage_directory: "~/.ros/find_object_3d_web/objects"
detector_objects_path: "~/.ros/find_object_3d_web/detector_objects"
