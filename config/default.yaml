# ros_deep_learning DepthNet normally publishes 32FC1 values. Change this to
# 0.001 only when the configured depth topic contains millimetres.
depth_scale: 1.0
depth_window_radius: 4
min_depth: 0.05
max_depth: 100.0
max_depth_age: 0.5
object_frame_prefix: "object_"
# Private image input used by the ROS Melodic find_object_2d node to add a template.
object_topic: "/find_object_2d/object"
bind_address: "0.0.0.0"
