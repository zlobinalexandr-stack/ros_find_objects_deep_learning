<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Выбор объекта — ROS</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <main>
    <header>
      <div><span class="tag">ROS Melodic</span><h1>Выберите объект</h1></div>
      <label>ID объекта <input id="object-id" type="number" min="0" value="0"></label>
    </header>
    <p>Обведите объект рамкой. Выделение будет добавлено в <code>find_object_2d</code>, а найденный объект появится в TF как <code>object_ID</code>.</p>
    <div id="viewport"><img id="camera" alt="Поток камеры"><canvas id="overlay"></canvas></div>
    <div class="actions"><button id="add" disabled>Добавить объект</button><span id="status">Ожидание изображения…</span></div>
  </main>
  <script src="app.js"></script>
</body>
</html>
